name: OpenSSF Scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # toda segunda 06:00 UTC (ajuste se quiser)
  push:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write # necessário para upload de SARIF no Code Scanning
  actions: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: results.sarif
