name: Manus Autopilot (checks)

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
    types: [completed]
    # Evita rodar em PRs do Dependabot e em runs no main.
    # Só dispara quando o run original (CI/CodeQL) foi executado em branches manus/*.
    branches:
      - 'manus/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Manus on failure / clear busy on success
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          MANUS_PROJECT_ID: ${{ secrets.MANUS_PROJECT_ID }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Só age em runs disparados por PR
            if (run.event !== "pull_request") {
              core.info(`Ignorando workflow_run (event=${run.event}).`);
              return;
            }

            const busyLabel = "manus-busy";
            const isSuccess = run.conclusion === "success";
            const isFailureLike = ["failure", "cancelled", "timed_out", "action_required"].includes(run.conclusion);

            // Se não é sucesso nem falha, não faz nada (ex: skipped/neutral)
            if (!isSuccess && !isFailureLike) {
              core.info(`Conclusão ${run.conclusion} não aciona autopilot.`);
              return;
            }

            async function getAssociatedPRNumbers() {
              // 1) tentativa pelo payload
              const prs = run.pull_requests || [];
              if (prs.length > 0) return prs.map(p => p.number);

              // 2) fallback por SHA
              const sha = run.head_sha;
              if (!sha) return [];

              try {
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: sha
                });
                return (data || []).map(pr => pr.number);
              } catch (e) {
                core.warning(`Falha ao buscar PR por SHA (${sha}): ${String(e?.message || e)}`);
                return [];
              }
            }

            const prNumbers = await getAssociatedPRNumbers();

            if (prNumbers.length === 0) {
              core.info("Nenhum PR associado a este workflow_run (nem por SHA).");
              return;
            }

            for (const prNumber of prNumbers) {
              const prResp = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const pr = prResp.data;

              const headRef = pr.head?.ref || "";
              if (!headRef.startsWith("manus/")) {
                core.info(`PR #${prNumber} não é manus/* (${headRef}). Ignorando.`);
                continue;
              }

              if (pr.state !== "open" || pr.draft) {
                core.info(`PR #${prNumber} não está pronto (state=${pr.state}, draft=${pr.draft}). Ignorando.`);
                continue;
              }

              const labels = (pr.labels || []).map(l => l.name);

              // ✅ Se passou -> remove busy e comenta
              if (isSuccess) {
                if (labels.includes(busyLabel)) {
                  await github.rest.issues.removeLabel({
                    owner, repo,
                    issue_number: prNumber,
                    name: busyLabel
                  }).catch(() => {});

                  await github.rest.issues.createComment({
                    owner, repo,
                    issue_number: prNumber,
                    body: `✅ Checks passaram (**${run.name}**). Label **${busyLabel}** removida.\nRun: ${run.html_url}`
                  }).catch(() => {});
                } else {
                  core.info(`PR #${prNumber}: checks success, mas não estava busy.`);
                }
                continue;
              }

              // ❌ Se falhou -> aciona Manus, mas só se não estiver busy
              if (labels.includes(busyLabel)) {
                core.info(`PR #${prNumber} já está busy (${busyLabel}). Não acionando outra task.`);
                continue;
              }

              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: prNumber,
                labels: [busyLabel]
              }).catch(() => {});

              const prompt = [
                "Você é o agente Manus responsável por corrigir falhas de CI/CodeQL neste repositório.",
                "",
                "ANTES DE QUALQUER MUDANÇA:",
                "- Leia o arquivo AGENTS.md na raiz do repositório e siga todas as regras.",
                "",
                `Repositório: ${owner}/${repo}`,
                `Pull Request: ${pr.html_url}`,
                `Branch do PR: ${headRef}`,
                "",
                "Falha detectada:",
                `- Workflow: ${run.name}`,
                `- Conclusão: ${run.conclusion}`,
                `- Run: ${run.html_url}`,
                `- SHA: ${run.head_sha}`,
                "",
                "Objetivo:",
                "1) Abrir o link do Run e identificar o PRIMEIRO step que falhou (mensagem de erro + arquivo/linha se houver).",
                "2) Corrigir com o MENOR patch possível (não refatorar sem necessidade).",
                `3) Fazer push de commits na MESMA branch do PR: ${headRef}`,
                "4) NÃO fazer merge.",
                "5) Repetir até ficar tudo verde (CI + CodeQL).",
                "",
                "Regras:",
                "- Se o erro for dependência/ambiente (ex.: missing env var / serviço externo), NÃO invente.",
                "  Comente no PR qual variável/serviço falta e pare.",
                "",
                "Ao finalizar, comentar no PR:",
                "- causa raiz (1–2 linhas)",
                "- arquivos alterados",
                "- como validar (comandos)"
              ].join("\n");

              const body = {
                prompt,
                agentProfile: "manus-1.6",
                taskMode: "agent",
                interactiveMode: false
              };

              if (process.env.MANUS_PROJECT_ID) body.projectId = process.env.MANUS_PROJECT_ID;

              const res = await fetch("https://api.manus.ai/v1/tasks", {
                method: "POST",
                headers: {
                  "API_KEY": process.env.MANUS_API_KEY,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
              });

              if (!res.ok) {
                const text = await res.text();
                // rollback busy para não travar
                await github.rest.issues.removeLabel({
                  owner, repo,
                  issue_number: prNumber,
                  name: busyLabel
                }).catch(() => {});
                throw new Error(`Manus API error: ${res.status} ${text}`);
              }

              const data = await res.json();
              const taskUrl = data?.metadata?.task_url || data?.task_url || "(sem task_url no payload)";

              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body: `🤖 **Manus Autopilot acionado**: **${run.name}** falhou.\n- Task: ${taskUrl}\n- Run: ${run.html_url}\n\n(Proteção ativa: label **${busyLabel}** adicionada.)`
              }).catch(() => {});
